name: daily-reel
# 月・水・金・土・日の 13:30（日本時間）にその日のリール動画を作って reels/ に保存する
on:
  schedule:
    - cron: '30 4 * * 0,1,3,5,6'
  workflow_dispatch:
    inputs:
      date:
        description: '作る日付（例 2026-10-27）。空なら今日'
        required: false
permissions:
  contents: write
concurrency: reel
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 準備
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install -q numpy pillow scipy requests
      - name: 動画を作る
        env:
          REEL_DATE: ${{ github.event.inputs.date }}
        run: python make_today.py
      - name: 保存する
        run: |
          git config user.name "peta-reel-bot"
          git config user.email "peta-reel-bot@users.noreply.github.com"
          git add -A reels
          git diff --cached --quiet || git commit -m "reel $(date -u +%F)"
          git push
